[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bug-reporter"
version = "0.1.0"
description = "Turn messy bug notes into structured, reproducible bug reports (offline rules or Claude)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lprvy" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
ai = ["anthropic>=2.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bugreport = "bugreporter.cli:main"

[tool.setuptools]
packages = ["bugreporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
